id = "ironfurnaces"
name = "Iron Furnaces"
version = "4.4.9"
description = "Furnaces of every metal, with augments, factories and generators. A port of Iron Furnaces (Qelifern, XenoMustache, Astryxion; Apache-2.0) to Sunrise's mod API."
authors = ["Sunrise port: Joeypc6", "Qelifern (pizzaatime)", "XenoMustache", "Astryxion"]
api = "0.2"
side = "both"
capabilities = ["registries"]
license = "GPL-3.0-only"
license_url = "https://github.com/Joeypc6/IronFurnaces-Sunrise/blob/main/LICENSE"
credits = "Sunrise port by Joeypc6, based on Iron Furnaces by Qelifern (pizzaatime), XenoMustache and Astryxion."
homepage = "https://github.com/Joeypc6/IronFurnaces-Sunrise"
issues = "https://github.com/Joeypc6/IronFurnaces-Sunrise/issues"

[dependencies]
# The W guide (pages in assets/ironfurnaces/ae2guide) and the recipe viewer's generator categories, when installed.
guideme = { version = "^0.1", optional = true }
jei = { version = "^0.5", optional = true }
# Applied Energistics 2's crafting ETA: the furnaces' craft times (`ae2::api::register_machine`, src/ae2_eta.rs).
ae2 = { version = "^15.4.13", optional = true }
# The shared machine-progress capability (machine_work::MACHINE_WORK, src/work.rs): AE2's crafting ETA asks it first.
machine_work = { version = "^0.1", optional = true }

[native]
game = "26.3"
# Pinned to Sunrise Dev 2026-11-24 (f8aa80e).
sunrise = "f8aa80e4c40cf1a5d30e85d13937f3fcf06d8237"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
